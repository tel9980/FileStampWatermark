name: Release — 打 tag 自动编 EXE

# 小白用法：
#   git tag v1.1.1.0
#   git push origin v1.1.1.0
# 推送后到 GitHub → Releases 页下载：
#   文件批量盖章与水印工具_<tag>.exe（免费版，发布用名）
#   文件批量盖章与水印工具_<tag>_赞助版.exe
# 附件是 Release 产物，不进 git，不违反 AGENTS.md 白名单铁律。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2

      - name: 还原 NuGet 包
        run: nuget restore WebShell/PDFQFZ.WebShell.csproj

      # ── 免费版（DefineConstants=TRACE，与 csproj Release 默认一致）──
      - name: 编译免费版
        run: msbuild WebShell/PDFQFZ.WebShell.csproj /t:Rebuild /p:Configuration=Release /p:Platform="AnyCPU" /p:DefineConstants="TRACE" /v:m

      - name: 暂存免费版
        shell: pwsh
        run: |
          $exe = "WebShell/bin/Release/PDFQFZ.WebShell.exe"
          if (!(Test-Path $exe)) { Write-Error "找不到 $exe"; exit 1 }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe "dist/free_tmp.exe" -Force

      # ── 赞助版（TRACE;VIP_PAID，开启主题色+徽章+自定义标题）──
      - name: 编译赞助版
        run: msbuild WebShell/PDFQFZ.WebShell.csproj /t:Rebuild /p:Configuration=Release /p:Platform="AnyCPU" /p:DefineConstants="TRACE;VIP_PAID" /v:m

      - name: 改名打包
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "local" }
          $freeExe = "WebShell/bin/Release/PDFQFZ.WebShell.exe"
          if (!(Test-Path $freeExe)) { Write-Error "找不到赞助版 $freeExe"; exit 1 }
          # 此时 bin 下是赞助版刚编出的；免费版已在 dist/free_tmp.exe
          Copy-Item "dist/free_tmp.exe" "dist/文件批量盖章与水印工具_${tag}.exe" -Force
          Copy-Item $freeExe "dist/文件批量盖章与水印工具_${tag}_赞助版.exe" -Force
          Remove-Item "dist/free_tmp.exe" -Force -ErrorAction SilentlyContinue
          Get-ChildItem dist | ForEach-Object { Write-Host "$($_.Name)  $($_.Length) bytes" }

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
