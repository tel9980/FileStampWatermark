name: Release — 打 tag 自动编 EXE

# 小白用法：
#   git tag v1.1.1.11
#   git push origin v1.1.1.11
# 推送后到 GitHub → Releases 页下载：
#   FileStampWatermark_<tag>.exe（单文件免安装版）
# 注：附件名用 ASCII（runner 对中文文件名支持不稳定，此前中文被吞）；
#     附件是 Release 产物，不进 git，不违反白名单铁律。
#
# 2026-10-20 起：不再产出赞助版（VIP）EXE——只发布免费版一个附件。
# 2026-10-21 起：赞助版相关源码（#if VIP_PAID 档位、主题色切换 / 等级徽章 / 自定义标题）已整体删除，
# 仓库只剩免费版一条线，不存在可恢复的档位。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2

      - name: 还原 NuGet 包
        run: nuget restore WebShell/PDFQFZ.WebShell.csproj

      # ── 免费版（Release，DefineConstants=TRACE）──
      - name: 编译免费版
        run: msbuild WebShell/PDFQFZ.WebShell.csproj /t:Rebuild /p:Configuration=Release /p:Platform="AnyCPU" /p:ErrorReport=None /v:m

      - name: 改名打包
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "local" }
          $exe = "WebShell/bin/Release/PDFQFZ.WebShell.exe"
          if (!(Test-Path $exe)) { Write-Error "找不到 $exe"; exit 1 }
          $f = Get-Item $exe
          if ($f.Length -lt 1MB) { Write-Error "EXE 体积异常（$($f.Length) bytes），疑似编译产物不完整"; exit 1 }
          Write-Host ("EXE: {0}  {1:N0} bytes" -f $f.Name, $f.Length)
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe "dist/FileStampWatermark_${tag}.exe" -Force
          Get-ChildItem dist | ForEach-Object { Write-Host "$($_.Name)  $($_.Length) bytes" }

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          body: |
            文件批量盖章与水印工具 ${{ github.ref_name }}

            下载说明：
            - `FileStampWatermark_<tag>.exe` — 单文件免安装版（本次唯一附件）

            单文件免安装，双击即可运行；首次运行后会在 EXE 同目录生成「运行组件」等配置文件。
