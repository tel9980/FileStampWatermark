name: Build

# 说明：本项目是 .NET Framework 4.7.2 + WPF + System.Drawing 的 Windows 桌面程序，
# 且 csproj 未引入 .sln，因此 CI 直接以 WebShell/PDFQFZ.WebShell.csproj 为构建目标。
# 依赖全部走 NuGet PackageReference（WebView2 / iTextSharp / bblanchon.PDFium / PdfiumViewer / Costura.Fody），
# 可在干净 clone 上还原；pdfium.dll、WebView2Loader.dll、WebUI 前端与手册文档均为 EmbeddedResource，
# 不依赖仓库内二进制，故 CI 无需额外准备文件。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支的新 push 取消仍在排队/运行中的旧构建，避免重复耗时
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (windows / .NET Framework 4.7.2)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # windows-latest 默认已启用 nuget.org；此处兜底确保启用（source 名可能因镜像而异，失败不阻断）
      - name: Ensure NuGet.org source enabled
        continue-on-error: true
        run: nuget sources update -Name "nuget.org" -Enabled true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 还原与构建分离，便于失败时区分是依赖问题还是编译问题。
      # ErrorReport=None 覆盖 csproj 里的 ErrorReport=prompt——该值在无人值守环境下可能挂起等待输入。
      - name: Restore
        run: >
          msbuild WebShell/PDFQFZ.WebShell.csproj
          -t:Restore
          -p:Configuration=Release
          -p:ErrorReport=None
          -v:minimal

      - name: Build
        run: >
          msbuild WebShell/PDFQFZ.WebShell.csproj
          -p:Configuration=Release
          -p:ErrorReport=None
          -m
          -v:minimal

      - name: Verify EXE produced
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path 'WebShell/bin/Release' -Filter '*.exe' -Recurse -ErrorAction SilentlyContinue
          if (-not $exe) { throw '构建结束但未产出 *.exe，判定为失败' }
          Write-Host ("产出 EXE: " + ($exe.FullName -join ', '))
          $exe | ForEach-Object { Write-Host ("  {0}  {1:N0} bytes" -f $_.Name, $_.Length) }

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: FileStampWatermark-Release
          path: WebShell/bin/Release/**
          if-no-files-found: error
          retention-days: 14