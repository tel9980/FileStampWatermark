name: CI — 轻量门禁

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: 语法/白名单/结构
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ──────────────────────────────────────────────
      # 0. Checkout
      # ──────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 方便扫历史，虽然主分支只有发布节点

      # ──────────────────────────────────────────────
      # 1. Node（用于 JS 语法检查）
      # ──────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ──────────────────────────────────────────────
      # 2. JS 语法检查（前端零编译期检查，最易炸）
      #    node --check 所有 bridge.js / modules/*.js
      #    以及 index.html 里的 <script> 块（单独抽出检查）
      # ──────────────────────────────────────────────
      - name: JS 语法检查
        run: |
          set -euo pipefail
          cd WebUI/prototype
          echo "检查 bridge.js..."
          node --check bridge.js
          echo "检查 modules/*.js..."
          for f in modules/*.js; do
            node --check "$f" || { echo "FAIL: $f"; exit 1; }
          done
          echo "✅ 所有 JS 语法通过"

      # ──────────────────────────────────────────────
      # 3. HTML 内联脚本语法检查（index.html 里的 <script>）
      #    这里简单抽取并用 node --check
      # ──────────────────────────────────────────────
      - name: HTML 内联脚本语法
        run: |
          set -euo pipefail
          cd WebUI/prototype
          # 提取 <script>...</script> 里的内容（不含 src= 的外链）用 node --check
          # （脚本在 .github/scripts/check_inline_js.py，避免 YAML 块内 heredoc 顶格导致 YAML 语法错误）
          python3 "${GITHUB_WORKSPACE}/.github/scripts/check_inline_js.py" index.html

      # ──────────────────────────────────────────────
      # 4. 白名单守卫（AGENTS.md 铁律：防公章/印章/交付版本/备份/.exe 入库）
      #    扫描暂存区+已跟踪文件（PR 时扫 diff，push 时扫 HEAD）
      # ──────────────────────────────────────────────
      - name: 白名单守卫
        run: |
          set -euo pipefail
          # 黑名单模式（正则，忽略大小写）
          # 注意：印章/公章/seal 只拦图片资源（*.png/jpg/bmp/ico 等），
          # 代码文件如 SealLib.cs / sealLib.js / list_seals.py 允许入库，此前 broad 写法会误伤。
          BLACKLIST=(
            '(公章|印章|seal)[^/]*\.(png|jpg|jpeg|bmp|gif|ico)$'
            '交付版本'
            '备份文件夹|备份[^a-zA-Z]'
            'E2E[\\/]'
            'PDFQFZ\.Tests[\\/]'
            '工具脚本[\\/]'
            '输出记录.*\.md$'
            'Web交付版本[\\/]'
            '\.exe$'
            'WebShell/Assets/公章\.png$'
            'app_icon_raw\.png$'
            '运行组件[\\/]'
            '\.pdb$'
            'obj[\\/]'
            'bin[\\/]'
            'packages[\\/]'
            '\.user$'
            '\.suo$'
            '_ReSharper'
            '\.vs[\\/]'
          )
          # 组装 egrep pattern
          PAT=$(IFS='|'; echo "${BLACKLIST[*]}")
          echo "扫描模式: $PAT"
          # 取扫描集合：PR 用 diff（base->HEAD），push 用 HEAD 全量
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # 获取 base sha
            BASE="${{ github.event.pull_request.base.sha }}"
            FILES=$(git diff --name-only "$BASE"..HEAD 2>/dev/null || git diff --name-only "$BASE" 2>/dev/null || echo "")
          else
            FILES=$(git ls-files)
          fi
          if [[ -z "$FILES" ]]; then
            echo "无文件变动，跳过"
            exit 0
          fi
          # 逐文件检查
          VIOL=0
          for f in $FILES; do
            if [[ -f "$f" ]]; then
              # .gitignore 已忽略的文件 git ls-files 不会出现，但 diff 可能出现已删除文件
              if echo "$f" | grep -qiE "$PAT"; then
                echo "🚫 违规文件: $f"
                VIOL=1
              fi
            fi
          done
          if [[ $VIOL -eq 1 ]]; then
            echo "❌ 白名单守卫失败：发现禁止入库文件"
            echo "请参考 AGENTS.md 第 5-11 行白名单/黑名单规则"
            exit 1
          fi
          echo "✅ 白名单守卫通过"

      # 5. 结构完整性：桥方法两端对齐（脚本见 .github/scripts/check_bridge_align.sh，
      #    内置内部/预留方法豁免名单）
      - name: 桥方法两端对齐
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/.github/scripts/check_bridge_align.sh"

      # 6. 技能包 Python 脚本语法检查（智能体调用链路的入口脚本）
      #    脚本写错语法 → 智能体侧直接执行失败，且不报错（Python 静默退出码 1）
      - name: 技能包 Python 语法检查
        run: |
          set -euo pipefail
          for f in WebShell/Docs/SkillPackage/file-stamp-watermark/scripts/*.py; do
            echo "检查 $f..."
            python3 -m py_compile "$f" || { echo "FAIL: $f"; exit 1; }
          done
          echo "✅ 技能包 Python 脚本语法通过"

  # ──────────────────────────────────────────────
  # 编译门禁（常驻）
  #
  # 为什么必须有：此前 ci.yml 只做轻量门禁（JS 语法 / 白名单 / 桥方法对齐），
  # 真正的编译只在 release.yml 打 tag 时才跑。结果 v1.1.1.5~v1.1.1.7 连续三个
  # 提交累积出三处硬编译错误却无人察觉，直到 tag 前才暴露：
  #   StampEngine.cs:258   字符字面量 (byte)') 缺闭引号（CS1010，阻断整个程序集编译）
  #   StampEngine.cs:213   用实例引用调用 static 的 GetPageContent（CS0176）
  #   StampEngine.cs:1054  castT 重复声明（CS0128）
  #
  # 双档编译（免费 Release / 赞助 ReleaseVIP=TRACE;VIP_PAID），与发布流程一致——
  # 赞助档走 #if VIP_PAID 编译常量，只编免费档会漏掉赞助档独有的编译问题。
  # ──────────────────────────────────────────────
  build:
    name: 编译门禁（windows / 双档）
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2

      # 仓库无 .sln（只有 WebShell/PDFQFZ.WebShell.csproj），故直接以 csproj 为目标
      - name: 还原 NuGet 包
        run: nuget restore WebShell/PDFQFZ.WebShell.csproj

      # /p:ErrorReport=None 覆盖 csproj 中的 ErrorReport=prompt——
      # 无人值守环境下 prompt 可能导致 msbuild 挂起等待输入。
      - name: 编译免费版（Release / TRACE）
        run: >
          msbuild WebShell/PDFQFZ.WebShell.csproj /t:Rebuild
          /p:Configuration=Release /p:Platform="AnyCPU" /p:ErrorReport=None /v:m

      - name: 校验免费版 EXE
        shell: pwsh
        run: |
          $exe = "WebShell/bin/Release/PDFQFZ.WebShell.exe"
          if (!(Test-Path $exe)) { Write-Error "编译未产出 $exe"; exit 1 }
          $f = Get-Item $exe
          Write-Host ("免费版 EXE: {0}  {1:N0} bytes" -f $f.Name, $f.Length)

      - name: 编译赞助版（ReleaseVIP / TRACE;VIP_PAID）
        run: >
          msbuild WebShell/PDFQFZ.WebShell.csproj /t:Rebuild
          /p:Configuration=ReleaseVIP /p:Platform="AnyCPU" /p:ErrorReport=None /v:m

      - name: 校验赞助版 EXE
        shell: pwsh
        run: |
          $exe = "WebShell/bin/ReleaseVIP/PDFQFZ.WebShell.exe"
          if (!(Test-Path $exe)) { Write-Error "编译未产出 $exe"; exit 1 }
          $f = Get-Item $exe
          Write-Host ("赞助版 EXE: {0}  {1:N0} bytes" -f $f.Name, $f.Length)
          # 两档应是不同二进制（DefineConstants 不同）；相同说明某一档的档位宏没生效
          $free = "WebShell/bin/Release/PDFQFZ.WebShell.exe"
          if ((Get-FileHash $free).Hash -eq (Get-FileHash $exe).Hash) {
            Write-Error "免费版与赞助版哈希相同——某一档的 DefineConstants 未生效"
            exit 1
          }
          Write-Host "双档产出为不同二进制，档位宏生效"

      # 只做校验、不上传 EXE 产物：交付由 release.yml 打 tag 时统一产出。
      # 每次 push 都传 EXE 无必要，也会让 .exe 落到 Actions 存储——
      # AGENTS.md 铁律针对 git 入库，但此处一并从严，避免混淆。
      - name: 归档编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            WebShell/obj/Release/**/*.binlog
            WebShell/obj/ReleaseVIP/**/*.binlog
          if-no-files-found: ignore
          retention-days: 7